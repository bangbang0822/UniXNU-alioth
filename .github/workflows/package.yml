name: package

# The packaging action of docs/porting/packaging.md: one command produces the boot
# image, the payload, the prelinked kernel and a manifest from a clean checkout. The
# platform seed comes from the repository secret UNIXNU_UNIQUE_CHIP_ID and is baked
# into the images, so the run's artifacts belong to one device alone: download them,
# then delete the run.
#
# This workflow deviates from scripts/package.sh in one place, on purpose. package.sh
# runs `unixnu release`, which assembles the tree and builds the kernel in a single
# step, and a cold tree cannot do that here: scripts/build-gop-legacy-display.py and
# build-sheng-hid-input.py read symbol addresses out of a previously prelinked kernel
# and write them into original-bindings.S, so the first kernel has nothing to bind
# against and stops with "No reference candidate available". The steps below therefore
# run the documented sequence explicitly and insert a bootstrap pass between `tree` and
# `build kernel`, exactly as configs/nabu_bootstrap_defconfig does in unixnu-nabu.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["17"]
        default: "17"
      runner:
        # macos-26 hosts the newest Xcode but has been the smaller pool twice tonight: runs sat
        # queued for fifteen minutes and were cancelled before a step ran. macos-15 is the same
        # arm64 host with an older Xcode, which is enough for every target this pipeline builds.
        description: "Hosted macOS image"
        type: choice
        options: ["macos-26", "macos-15", "macos-14"]
        default: "macos-26"
      payload:
        # The kernel build and the payload runtime are separate halves of one command because
        # --init-data only reaches scripts/unixnu/runtime.py with a payload step in the same
        # invocation. Iterating on the kernel's archive list and link does not need Mesa, Turnip,
        # the Rust bridge or the Metal plugin, and those cost about forty minutes of the run, so a
        # false value links the kernel alone and stops before the boot image.
        description: "Build the payload runtime too (false links the kernel only)"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: read

concurrency:
  # A dispatch must not cancel a run that is still waiting for a hosted runner. It did: rotating the
  # macOS label every few minutes cancelled each queued run before it could start, so twelve
  # dispatches in a row produced twelve cancellations and no build. Queue instead; the packaging job
  # is safe to serialise because it is dispatched by hand.
  group: package-${{ github.ref }}
  cancel-in-progress: false

env:
  UNIXNU_UEFI: ${{ github.workspace }}/uefi-alioth
  ALIOTH_WIFI_DIR: ${{ github.workspace }}/device/drivers/AliothWifi
  # scripts/prepare-xnu-source.py lists Apple's DriverKit headers through api.github.com.
  # Unauthenticated that is 60 requests an hour per address, which hosted runners share, and
  # the run dies with "HTTP Error 403: rate limit exceeded" partway into the kernel step. The
  # script reads GITHUB_TOKEN or GH_TOKEN and sends it to GitHub hosts only.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # The Rust bridge builds with fat LTO and one codegen unit (its manifest asks for both), which
  # peaked past this runner's memory: one run's log stopped at "Compiling adreno-metal-bridge"
  # with no error, and the run before it finished the same step in 24m21s. One cargo job at a
  # time trades wall clock for headroom.
  CARGO_BUILD_JOBS: "1"

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          # The board selects QcomXnuUsbDebug, which the upstream catalog does not carry
          # yet; porting-record.yml pins FFT-infra/UniXNU for the same reason. Switch this
          # back to UniXNU/UniXNU once that component is upstream.
          repository: FFT-infra/UniXNU
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: FFT-infra/uefi-alioth
          path: uefi-alioth
          submodules: recursive   # the firmware volume builds from the checkout's submodules
      - name: tools
        run: |
          # bison and flex are keg-only, so they never reach /opt/homebrew/bin; the Mesa build
          # generates src/freedreno/ir3/ir3_parser.[ch] from ir3_parser.y, and the bison that ships
          # with the runner image is 2.3, which rejects the file's Bison 3 grammar. Put the kegs
          # first and hold the version here rather than discovering it inside a forty-minute build.
          brew install dtc llvm lld cmake mtools glslang bison flex shaderc spirv-tools openssl@3 blacktop/tap/ipsw
          for keg in bison flex; do
            if [ -d "/opt/homebrew/opt/$keg/bin" ]; then
              echo "/opt/homebrew/opt/$keg/bin" >> "$GITHUB_PATH"
            fi
          done
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw glslangValidator bison flex glslc spirv-val; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          bison_version=$(bison --version | head -1)
          echo "$bison_version"
          version=${bison_version##* }
          major=${version%%.*}
          case "$major" in
            ''|*[!0-9]*) echo "unreadable bison version: $version"; ok=0 ;;
            *) [ "$major" -ge 3 ] || { echo "bison is older than 3.0: $version"; ok=0; } ;;
          esac
          # The Metal bridge is a Rust static library and its recipe pins a toolchain: cargo +1.98.0
          # with the aarch64-apple-ios target. The image ships rustup but not that toolchain, and a
          # missing one only surfaces minutes into the payload build.
          if rustup toolchain list | grep -q '^1\.98\.0'; then
            echo 'rust 1.98.0 present'
          else
            rustup toolchain install 1.98.0 --profile minimal --target aarch64-apple-ios
          fi
          rustup toolchain list | grep -q '^1\.98\.0' || { echo 'missing toolchain: 1.98.0'; ok=0; }
          rustup target list --toolchain 1.98.0 --installed | grep -qx 'aarch64-apple-ios' || { echo 'missing rust target: aarch64-apple-ios'; ok=0; }
          [ -f /opt/homebrew/opt/llvm/bin/llvm-as ] || { echo 'missing tool: llvm-as'; ok=0; }
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: data seed
        # board.toml carries no [payload.runtime] builder and alioth_defconfig sets
        # CONFIG_XNU_OWNER_DATA_MOUNT, so scripts/unixnu/runtime.py takes the fallback branch
        # and scripts/unixnu/payload.py refuses to build without --data-ramdisk. The seed is
        # not in any repository; supply this device's own packed seed.
        #
        # A missing seed is a warning, not a failure: the kernel, the firmware and the boot
        # chain before the payload do not need one, so a run without it still validates them.
        id: seed
        env:
          seed_url: ${{ secrets.UNIXNU_DATA_SEED_URL }}
          trust_url: ${{ secrets.UNIXNU_TRUST_CACHE_URL }}
        run: |
          mkdir -p runtime
          have=0
          if [ -z "$seed_url" ]; then
            echo '::warning::No UNIXNU_DATA_SEED_URL: the payload, the boot image and everything after them are skipped.'
            echo 'CONFIG_XNU_OWNER_DATA_MOUNT is on and no [payload.runtime] builder exists, so'
            echo 'build payload needs this device'"'"'s packed Data seed before it can run.'
          else
            curl -fsSL "$seed_url" -o runtime/data.dbr
            shasum -a 256 runtime/data.dbr
            have=1
            if [ -n "$trust_url" ]; then
              curl -fsSL "$trust_url" -o runtime/trust.bundle
              shasum -a 256 runtime/trust.bundle
            else
              echo '::warning::No UNIXNU_TRUST_CACHE_URL: the image will boot the kernel but AMFI will refuse the first exec.'
            fi
          fi
          echo "have=$have" >> "$GITHUB_OUTPUT"
        working-directory: device
      - name: mesa patch set
        # feeds.resolve hands each (kind, name) module to the first base that carries it, and the
        # device repository is that first base: this repository's patches/mesa holds two board
        # patches, so the tree's patches/mesa is those two files alone and the seventeen Mesa
        # patches pinned by scripts/data/adreno-compiler-inputs.json are shadowed by the directory,
        # not merged into it. The payload's runtime builder then stops at the first pinned patch it
        # cannot open: patches/mesa/freedreno-tools-nir.patch.
        #
        # --local-module outranks every base, so point patch:mesa at the union of the two
        # directories for the duration of the run. Nothing else moves: patches/xnu stays this
        # repository's own series, which is what the kernel build already applies, and the extra
        # board patches are the ones the Mesa sources are already patched with.
        run: |
          set -euo pipefail
          union="$GITHUB_WORKSPACE/runtime/patches-mesa"
          rm -rf "$union"
          mkdir -p "$union"
          cp -R UniXNU/patches/mesa/. "$union/"
          cp -R device/patches/mesa/. "$union/"
          echo "union: $(ls -1 "$union" | wc -l | tr -d ' ') patches"
          ls -1 "$union"
          echo "UNIXNU_PATCH_MESA=$union" >> "$GITHUB_ENV"
      - name: defconfig, fetch, tree
        working-directory: UniXNU
        run: |
          set -euo pipefail
          mesa=(--local-module "patch:mesa=$UNIXNU_PATCH_MESA")
          ./unixnu defconfig alioth_defconfig -D ../device "${mesa[@]}"
          ./unixnu fetch -D ../device "${mesa[@]}"
          ./unixnu tree -D ../device "${mesa[@]}"
          # build-alioth-wifi.py reads ALIOTH_WIFI_SHARED for Ath12kWifi's include/nw_abi.h.
          # The feed directory only exists after fetch, so resolve it here into the env.
          wifi=$(ls -d "$GITHUB_WORKSPACE"/UniXNU/out/feeds/Ath12kWifi-* | head -1)
          [ -n "$wifi" ] || { echo '::error::Ath12kWifi was not fetched; is it still in [components] include?'; exit 1; }
          echo "ALIOTH_WIFI_SHARED=$wifi" >> "$GITHUB_ENV"
      - name: adreno metal source
        # scripts/build-adreno-metal-bridge.py reads the bridge patches from
        # ROOT/drivers/AdrenoMetal/bridge/patches, builds ROOT/drivers/AdrenoMetal/bridge/NativeMetalBridge.rs
        # and assembles ROOT/drivers/AdrenoMetal/shaders/scanout_convert.ll, all with ROOT inside the
        # tree, which links only selected components and so has no drivers/AdrenoMetal.
        #
        # Take the tools checkout's copy, not this repository's submodule. The recipe is the tools
        # checkout's product and its patch series is pinned to that checkout's translator revision:
        # the runner pins the translator at 555b13d5, while this repository's driver branch still
        # carries the series for the earlier 963f0e64, and applying it stops at
        # 0005-skip-draws-without-a-pipeline.patch with "patch does not apply". The device fork is
        # still what the Metal plugin compiles, but that script reads it through UNIXNU_DEVICE.
        #
        # A copy, not a link: unixnu tree's _clear_links removes every symlink under tree/drivers on
        # each run, and the build step runs tree again. Selecting the AdrenoMetal component would also
        # produce the directory and is wrong here: the catalog gives it a dependency on Adreno740
        # whose build_stage is kernel, so the archive plan would compile the SM8550 driver into this
        # board's kernel.
        working-directory: UniXNU
        run: |
          set -euo pipefail
          tree=$(ls -d out/alioth/*/alioth/tree | head -1)
          base="$GITHUB_WORKSPACE/UniXNU/drivers/AdrenoMetal"
          fork="$GITHUB_WORKSPACE/device/drivers/AdrenoMetal"
          if [ -f "$base/bridge/NativeMetalBridge.rs" ]; then
            src="$base"
          else
            echo '::warning::the tools checkout has no drivers/AdrenoMetal; falling back to this repository'
            src="$fork"
          fi
          test -f "$src/NativeAdrenoMetalPlugin.mm" || test -f "$src/bridge/NativeMetalBridge.rs"
          mkdir -p "$tree/drivers"
          rm -rf "$tree/drivers/AdrenoMetal"
          cp -R "$src" "$tree/drivers/AdrenoMetal"
          rm -f "$tree/drivers/AdrenoMetal/.git"
          ls "$tree/drivers/AdrenoMetal/bridge/patches" | head
          echo "adreno metal source: $src"
          echo "adreno metal source: $(ls -1 "$tree/drivers/AdrenoMetal" | wc -l | tr -d ' ') files"
      - name: verified root cache
        # The two signed block tables and the host library are deterministic in their inputs (the
        # IPSW members, the owner key and the kit source), and signing them verifies about 2.3
        # million 4 KiB blocks. Restoring them from the cache removes the IPSW download, the 8.5 GB
        # of extraction and both policy runs from every run after the first.
        id: vrcache
        uses: actions/cache@v4
        with:
          path: |
            UniXNU/out/alioth/*/alioth/tree/build/verified-root-os
            UniXNU/out/alioth/*/alioth/tree/build/verified-root-systemos
            UniXNU/out/alioth/*/alioth/tree/build/verified-root-host
          key: verified-root-21H461-806400-v1
          restore-keys: verified-root-21H461-
      - name: rust bridge cache
        # The bridge is a Rust static library built with fat LTO, and a cold build takes 24 minutes.
        # Its inputs are the translator pin and the recorded patch series under the tools checkout,
        # so key the cache on exactly those: a restored archive makes the plugin skip the build.
        uses: actions/cache@v4
        with:
          path: |
            UniXNU/out/alioth/*/alioth/tree/build/m2v-target
            UniXNU/out/alioth/*/alioth/tree/build/adreno-metal-bridge
          key: rust-bridge-${{ hashFiles('UniXNU/scripts/data/gpu-metal-vulkan-inputs.json', 'UniXNU/drivers/AdrenoMetal/bridge/patches/*.patch') }}
          restore-keys: rust-bridge-
      - name: verified root inputs
        # scripts/build-owner-os-policy.py and build-owner-systemos-policy.py sign the original
        # volumes' block tables, and build-verified-root-probe.py turns that into the archive the
        # kernel force-loads behind CONFIG_XNU_VERIFIED_ROOT_PROBE. Both policy recipes read
        # <tree>/.cache/firmware/target-volumes, which is this repository's .cache/firmware through
        # the tree's link, and the OS one also requires its image to be attached read-only with the
        # mount point it inspects.
        #
        # None of this was ever scripted: build/verified-root-host (the host library and the owner
        # key) had no producer anywhere in the tools checkout, exactly as build/verified-root-os and
        # build/verified-root-systemos had none, and the kernel link stops without them. Build them
        # here from the recipes that do exist. The host library is the kit's own C plus its OpenSSL
        # provider; the key is a fresh RSA-3072 pair, which manifest.public_anchor() checks for
        # exponent 65537 and a 384-byte modulus.
        working-directory: UniXNU
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/openssl@3/bin:$PATH"
          tree=$(ls -d out/alioth/*/alioth/tree | head -1)
          volumes="$GITHUB_WORKSPACE/device/.cache/firmware/target-volumes"
          host="$tree/build/verified-root-host"
          mkdir -p "$volumes" "$host/keys"

          if [ -f "$tree/build/verified-root-os/verification.json" ] &&
             [ -f "$tree/build/verified-root-systemos/verification.json" ] &&
             [ -f "$host/verified-root.dylib" ] && [ -f "$host/keys/owner.pem" ]; then
            echo "verified root fixtures restored from cache: $(ls -d "$tree"/build/verified-root-*)"
          else
            openssl version
            openssl genrsa -out "$host/keys/owner.pem" 3072
            openssl rsa -in "$host/keys/owner.pem" -pubout -out "$host/keys/owner-public.pem"
            openssl rsa -pubin -in "$host/keys/owner-public.pem" -modulus -noout | head -c 60; echo

            clang -dynamiclib -O2 -Wall -Wextra \
              -I "$tree/kits/VerifiedRoot/include" -I /opt/homebrew/opt/openssl@3/include \
              "$tree/kits/VerifiedRoot/src/verified_root.c" \
              "$tree/kits/VerifiedRoot/tests/openssl_provider.c" \
              -L /opt/homebrew/opt/openssl@3/lib -lcrypto \
              -o "$host/verified-root.dylib"
            nm -gU "$host/verified-root.dylib" | grep -E 'vr_host_open|vr_host_block'

            ipsw="$GITHUB_WORKSPACE/runtime/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
            mkdir -p "$GITHUB_WORKSPACE/runtime"
            [ -f "$ipsw" ] || curl -fL --retry 3 --retry-delay 5 -o "$ipsw" \
              "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
            unzip -o -j "$ipsw" "044-76040-038.dmg" -d "$volumes"
            # The SystemOS member sits at the archive root, not under Firmware/ beside its trust cache,
            # so a path guess stops the step with unzip's "filename not matched". Its size is fixed by
            # the recipe as 806400 blocks of 4096 bytes; compute that rather than writing it out, which
            # is how a first attempt came to ask for a member 4,608 bytes short of the real one.
            sysos_bytes=$((806400 * 4096))
            member=$(unzip -l "$ipsw" | awk -v want="$sysos_bytes" '$1 == want {print $4; exit}')
            if [ -z "$member" ]; then
              echo "::error::no $sysos_bytes-byte member in the IPSW; its disk images are:"
              unzip -l "$ipsw" | grep -i '\.dmg' | head -20
              exit 1
            fi
            echo "SystemOS member: $member ($sysos_bytes bytes)"
            rm -rf "$GITHUB_WORKSPACE/runtime/sysos" && mkdir -p "$GITHUB_WORKSPACE/runtime/sysos"
            unzip -o -j "$ipsw" "$member" -d "$GITHUB_WORKSPACE/runtime/sysos"
            mv -f "$GITHUB_WORKSPACE/runtime/sysos/$(basename "$member")" "$volumes/044-76034-038.dmg"

            # Both recipes refuse anything but the exact supplied members, so check before they do.
            echo '3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d  '"$volumes/044-76040-038.dmg" | shasum -a 256 -c -
            echo 'b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f  '"$volumes/044-76034-038.dmg" | shasum -a 256 -c -

            mkdir -p "$volumes/os-mount"
            hdiutil attach -readonly -nobrowse -mountpoint "$volumes/os-mount" "$volumes/044-76040-038.dmg"
            hdiutil info | grep -A2 '044-76040-038.dmg' | head -5
            du -sh "$volumes"

            # Sign both block tables here rather than inside the archive list: this step runs before
            # the bootstrap pass, so a refusal costs a minute instead of a full XNU build, and the
            # images can be detached and deleted afterwards. Only the two recipes that need the
            # compile records stay in board.toml's archive list.
            python3 "$tree/scripts/build-owner-os-policy.py"
            python3 "$tree/scripts/build-owner-systemos-policy.py"
            hdiutil detach "$volumes/os-mount"
            rm -f "$volumes/044-76040-038.dmg" "$volumes/044-76034-038.dmg" "$ipsw"
          fi
          # build-verified-root-probe.py reuses bsd_init.o.json's compile arguments, which name
          # build/xnu/ios-obj/EXPORT_HDRS/libsa, and appends -Werror, so a directory that the kernel
          # build has not created yet is a hard error rather than a warning. The probe's own sources
          # do not include libsa headers; the flag only has to resolve.
          mkdir -p "$tree/build/xnu/ios-obj/EXPORT_HDRS/libsa"
          ls -ld "$tree/build/xnu/ios-obj/EXPORT_HDRS/libsa"
          ls -l "$tree/build/verified-root-os" "$tree/build/verified-root-systemos" | head -20
      - name: adreno ABI include dir
        working-directory: UniXNU
        run: |
          set -euo pipefail
          # scripts/build-turnip-darwin.py passes -Dtu-darwin-abi-dir and
          # scripts/build-adreno-metal-plugin.py adds -I for the same directory, both hardcoded
          # to ROOT/drivers/Adreno740. Adreno740 is the SM8550 driver; this board selects the
          # Adreno650 component, whose checkout keeps the same header names, and the tree has no
          # drivers/Adreno740 at all, so the Mesa configure stops with
          #   ERROR: Include dir .../tree/drivers/Adreno740 does not exist.
          #
          # Mesa only uses the directory as an include path, and the two scripts belong to the
          # tools checkout that this workflow does not own, so give them an environment override
          # here and point it at whatever driver directory this tree resolved. The hardcoded
          # value stays the default, so every other board is unaffected.
          tree=$(ls -d out/alioth/*/alioth/tree | head -1)
          test -d "$tree/drivers/Adreno650"
          echo "ADRENO_ABI_DIR=$GITHUB_WORKSPACE/UniXNU/$tree/drivers/Adreno650" >> "$GITHUB_ENV"
          python3 - <<'PATCH'
          import pathlib, sys
          for name in ('build-turnip-darwin.py', 'build-adreno-metal-plugin.py'):
              path = pathlib.Path('scripts') / name
              text = path.read_text()
              if 'ADRENO_ABI_DIR' in text:
                  print(name, 'already patched')
                  continue
              stale = "ROOT / 'drivers/Adreno740'"
              if stale not in text:
                  sys.exit(name + ': no hardcoded Adreno740 include path')
              count = text.count(stale)
              # Replace first, insert second: the definition itself carries the literal.
              text = text.replace(stale, 'ABI_DIR')
              anchor = 'ROOT = Path(__file__).resolve().parents[1]\n'
              if text.count(anchor) != 1:
                  sys.exit(name + ': ROOT anchor is not unique')
              text = text.replace(anchor, anchor +
                  "ABI_DIR = Path(os.environ.get('ADRENO_ABI_DIR') or ROOT / 'drivers/Adreno740')\n", 1)
              if '\nimport os\n' not in text:
                  text = text.replace('\nimport json\n', '\nimport json\nimport os\n', 1)
              path.write_text(text)
              print(name, 'patched', count, 'include path(s)')
          PATCH
      - name: bootstrap kernel and prelinked candidate
        working-directory: UniXNU
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/UniXNU/out/alioth"
          # A cold tree has no reference candidate, so the two archive builders that bind
          # against one cannot run. Both now carry the same no-op fallback
          # scripts/build-platform-power.py uses for its bridge: they emit a first-pass archive
          # and exit, the kernel links, and the next build has the reference.
          #
          # The display recipe lives in the device repository, so its fallback travels with the
          # commit. The HID recipe lives in the tools checkout, which this workflow does not own,
          # so the same guard is spliced in here for the duration of the run.
          hid=scripts/build-sheng-hid-input.py
          if ! grep -q 'first-pass objects' "$hid"; then
            python3 - "$hid" <<'PATCH'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          t = p.read_text()
          anchor = "p=ROOT/'build/xnu-prelink/native-owner-ufs-cpu-desktop-v9-hid-init-candidate.macho'\n"
          guard = anchor + '''
          # First-pass fallback, same idiom as scripts/build-platform-power.py. The tools
          # checkout is not this repository's to change; the macOS workflow splices this in.
          if not p.exists() and not any((ROOT/'build/xnu-prelink').glob('native-owner-ufs-cpu-desktop-*-candidate.macho')):
              _stub = OUT/'FirstPassStub.c'
              _stub.write_text('// No reference candidate yet.\\n')
              for _name in ('NativeHidInput.late.o', 'hid-original-bindings.o'):
                  run(['xcrun','clang','-target',TRIPLE,'-isysroot',
                       run(['xcrun','--sdk','iphoneos','--show-sdk-path'],text=True).strip(),
                       '-c',_stub,'-o',OUT/_name])
              print('HID input: no reference candidate yet; wrote first-pass objects.')
              raise SystemExit(0)
          '''
          if 'first-pass objects' in t:
              print('already patched')
          elif anchor in t:
              p.write_text(t.replace(anchor, guard, 1)); print('patched')
          else:
              sys.exit('anchor not found in the HID recipe')
          PATCH
          fi
          ./unixnu defconfig alioth_bootstrap_defconfig -D ../device --local-module "patch:mesa=$UNIXNU_PATCH_MESA"
          # The bootstrap configuration names this object through CONFIG_XNU_EXTRA_LD_ARCHIVES.
          # It carries the three bodies the XNU patches call into the legacy display driver; on a
          # cold tree the archive that normally defines them cannot be built, because building it
          # is what needs the candidate this pass produces. Mach-O, and passed as an object
          # rather than an archive: this link path appends the value without -Wl,-force_load.
          ./unixnu tree -D ../device --local-module "patch:mesa=$UNIXNU_PATCH_MESA"
          boot_tree=$(ls -d "$out"/*/alioth_bootstrap/tree | head -1)
          # The archive list is board.toml's, so this pass runs it too, and it now ends with the
          # verified-root probe. That recipe reads the policy fixtures the verified root inputs step
          # signed into the shipping tree, which this one does not have. Copy them across: the tables
          # are one 32-byte digest per block, about 72 MB for both volumes.
          main_tree=$(ls -d "$out"/*/alioth/tree | head -1)
          for fixture in verified-root-os verified-root-systemos verified-root-host; do
            if [ -d "$main_tree/build/$fixture" ]; then
              rm -rf "$boot_tree/build/$fixture"
              cp -R "$main_tree/build/$fixture" "$boot_tree/build/$fixture"
            fi
          done
          ls -d "$boot_tree"/build/verified-root-* 2>/dev/null || true
          mkdir -p "$boot_tree/build/bootstrap-stubs"
          cat > "$boot_tree/build/bootstrap-stubs/stubs.c" <<'STUBS'
          /* No reference candidate yet: the legacy display archive would define these. */
          void native_legacy_count_exec(void);
          void native_legacy_note_exit(void);
          void native_legacy_paint_userspace_band(void);
          void native_legacy_count_exec(void) {}
          void native_legacy_note_exit(void) {}
          void native_legacy_paint_userspace_band(void) {}
          STUBS
          xcrun clang -arch arm64 -mkernel -miphoneos-version-min=17.0 \
            -c "$boot_tree/build/bootstrap-stubs/stubs.c" \
            -o "$boot_tree/build/bootstrap-stubs/stubs.o"
          ls -l "$boot_tree/build/bootstrap-stubs/stubs.o"
          # board.toml's archive list is shared with the shipping build, so this pass would also run
          # the two verified-root recipes. It cannot: build-verified-root-probe.py compiles against
          # build/xnu/ios-obj/EXPORT_HDRS, which a bootstrap pass does not generate because it only
          # leaves the compile records and the link file list, and this configuration sets neither
          # verified-root switch, so nothing here links that archive anyway. Stand the two entries
          # down for this build and put the file back afterwards.
          cp ../device/board.toml "$RUNNER_TEMP/board.toml.with-verified-root"
          python3 - <<'DROP'
          import pathlib
          path = pathlib.Path('../device/board.toml')
          kept, dropped = [], []
          for line in path.read_text().splitlines(keepends=True):
              entry = line.strip()
              if entry.startswith('"') and entry.endswith('",') and (
                      'verified-root' in entry or 'verified-bundle' in entry):
                  dropped.append(entry)
                  continue
              kept.append(line)
          if not dropped:
              raise SystemExit('no verified-root archive entries to stand down')
          path.write_text(''.join(kept))
          print('stood down', len(dropped), 'entries for the bootstrap pass:')
          for entry in dropped:
              print('  ' + entry)
          DROP
          ./unixnu build kernel -D ../device --local-module "patch:mesa=$UNIXNU_PATCH_MESA"
          cp "$RUNNER_TEMP/board.toml.with-verified-root" ../device/board.toml
          echo "restored board.toml: $(grep -c verified-root-bundle ../device/board.toml) verified-root entries"
          boot=$(ls -d "$out"/*/alioth_bootstrap | head -1)
          if [ -f "$boot/kernel/kernel.macho" ]; then
            prelink="$(ls -d "$out"/*/alioth | head -1)/tree/build/xnu-prelink"
            mkdir -p "$prelink"
            for name in native-owner-mobile-graphics-candidate \
                        native-owner-ufs-cpu-desktop-v9-hid-init-candidate; do
              cp "$boot/kernel/kernel.macho" "$prelink/$name.macho"
              cp "$boot/kernel/kernel.json"  "$prelink/$name.json"
            done
            ls -l "$prelink"
          else
            echo '::error::the bootstrap pass produced no kernel.macho under alioth_bootstrap'
            exit 1
          fi
          # Put the shipping configuration back before the real build.
          ./unixnu defconfig alioth_defconfig -D ../device --local-module "patch:mesa=$UNIXNU_PATCH_MESA"
      - name: display ABI provenance marker
        working-directory: UniXNU
        run: |
          set -euo pipefail
          # scripts/audit-mobile-graphics-legacy.py reads exactly one field out of this file,
          # runtime_metadata_checkpoint_sha256, and unconditionally rewrites everything else
          # (abstract_slots, methods, legacy_vptr, and the candidate and original digests) from
          # the candidate kernel and its plan. The value below is the recorded hash of the
          # pruned QEMU observation, hardcoded at audit-mobile-graphics-legacy.py:60; that
          # script's own comment says the observation "was pruned ... only its recorded hash is
          # carried over".
          #
          # State this plainly: writing the marker REPLAYS that provenance token, it does not
          # re-establish the observation. An image built from this run has a display ABI that
          # was regenerated from the candidate and checked against the original family text,
          # but its runtime checkpoint is inherited rather than re-measured. Re-measuring it
          # needs the ESP plus gdb-stop.py route, which needs a Data seed first.
          tree=$(ls -d "$GITHUB_WORKSPACE"/UniXNU/out/alioth/*/alioth/tree | head -1)
          mkdir -p "$tree/build/display-analysis"
          cat > "$tree/build/display-analysis/mobile-graphics-legacy-abi.json" <<'JSON'
          {"runtime_metadata_checkpoint_sha256": "3044c2beff552911605994c0dc7aa73182066cbb5aed0b396999ceeb5a96da2b"}
          JSON
          cat "$tree/build/display-analysis/mobile-graphics-legacy-abi.json"
      - name: build kernel
        working-directory: UniXNU
        run: |
          set -euo pipefail
          mesa=(--local-module "patch:mesa=$UNIXNU_PATCH_MESA")
          # --init-data only reaches scripts/unixnu/runtime.py when the same invocation also has
          # a payload step: cli.py:169 calls runtime.prepare() only if 'payload' or 'runtime' is
          # in the step list, and runtime.py refuses --init-data unless a kernel build is in it
          # too. So the two steps have to be one command on the first-install path.
          if [ "${{ steps.seed.outputs.have }}" = '1' ]; then
            ./unixnu build kernel -D ../device "${mesa[@]}"
          elif [ "${{ inputs.payload }}" = 'false' ]; then
            echo 'Kernel only: the payload runtime (Mesa, Turnip, the Rust bridge, the plugin) is not prepared.'
            ./unixnu build kernel -D ../device "${mesa[@]}"
          else
            echo 'No seed supplied: building kernel and payload together with --init-data.'
            ./unixnu build kernel payload -D ../device --uefi "$UNIXNU_UEFI" --init-data "${mesa[@]}"
          fi
      - name: build firmware
        working-directory: UniXNU
        run: |
          set -euo pipefail
          ./unixnu build firmware -D ../device --uefi "$UNIXNU_UEFI"
      - name: build payload
        # Only when a seed was supplied. The first-install path built the payload together with
        # the kernel above, because --init-data has to run inside a kernel build.
        if: steps.seed.outputs.have == '1'
        working-directory: UniXNU
        run: |
          set -euo pipefail
          args=(build payload -D ../device --uefi "$UNIXNU_UEFI"
                --data-ramdisk ../device/runtime/data.dbr
                --local-module "patch:mesa=$UNIXNU_PATCH_MESA")
          if [ -f ../device/runtime/trust.bundle ]; then
            args+=(--trust-cache ../device/runtime/trust.bundle)
          fi
          ./unixnu "${args[@]}"
      - name: bootimg
        # The boot image carries the payload; without it there is nothing to pack.
        if: inputs.payload != 'false'
        working-directory: UniXNU
        run: |
          set -euo pipefail
          ./unixnu bootimg -D ../device --uefi "$UNIXNU_UEFI" \
            --dtb "$UNIXNU_UEFI/Resources/DTBs/alioth.dtb" -o ../device/boot.img
      - name: build logs
        # A failing producer writes its reason into its own log and only a summary reaches the step
        # output: the Mesa build prints "Build failed; see ...mesa-tu-ios-build.log" and leaves the
        # compiler error in that file, which is on the runner and gone with it. Upload them on any
        # failure so the next diagnosis starts from the real message.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.os }}
          retention-days: 2
          if-no-files-found: warn
          path: |
            UniXNU/out/alioth/*/*/logs/*.log
            UniXNU/out/alioth/*/*/tree/.cache/*.log
            UniXNU/out/alioth/*/*/tree/build/**/*.log
      - name: images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            device/boot.img
            UniXNU/out/alioth/*/*/boot/boot.img
            UniXNU/out/alioth/*/*/payload/payload.img
            UniXNU/out/alioth/*/*/kernel/kernel.macho
            UniXNU/out/alioth/*/*/package.manifest.json
